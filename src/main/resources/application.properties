# ================== SERVER ==================
spring.config.import=optional:file:.env[.properties]
server.port=8082
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# URL giao diện dùng trong liên kết gửi qua email. Khi demo nhiều thiết bị,
# đặt APP_FRONTEND_URL thành IP LAN, domain hoặc URL ngrok có thể truy cập được.
app.frontend.base-url=${APP_FRONTEND_URL:http://192.168.1.63:5173}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.jpa.open-in-view=false

# ================== SQL SERVER ==================
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=CarStore;encrypt=false;trustServerCertificate=true}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123}
# ================== JPA ==================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ================== INIT DATA (SQL Server) ==================
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# ================== SMTP ==================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.properties.mail.debug=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ================== GOOGLE OAUTH2 ==================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8082/login/oauth2/code/google

# ================== SEPAY ==================
sepay.merchant-id=${SEPAY_MERCHANT_ID:}
sepay.secret-key=${SEPAY_SECRET_KEY:}
sepay.api-key=${SEPAY_API_KEY:}
sepay.checkout-url=${SEPAY_CHECKOUT_URL:https://pay-sandbox.sepay.vn/v1/checkout/init}
